# Sicherheitsnetz fuer den Self-Update-Kanal: der VPS zieht origin/main
# automatisch -- rote Tests hier heissen "nicht mergen/pushen".
name: tests

on:
  push:
  pull_request:

jobs:
  unittest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m unittest discover -s tests -v
